name: Vault Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vault-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run Obsidian vault lint
        run: python3 tools/vault_lint.py .
